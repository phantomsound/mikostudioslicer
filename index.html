<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Miko Studio Slicer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ag-psd/dist/bundle.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    .checker-pattern {
      background-image: linear-gradient(45deg, #1c1d22 25%, transparent 25%),
                        linear-gradient(-45deg, #1c1d22 25%, transparent 25%),
                        linear-gradient(45deg, transparent 75%, #1c1d22 75%),
                        linear-gradient(-45deg, transparent 75%, #1c1d22 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #141418;
    }
  </style>
</head>
<body class="bg-[#121316] text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-amber-500 selection:text-black">

  <!-- HEADER -->
  <header class="border-b border-[#24252f] bg-[#18191f]/90 backdrop-blur px-6 py-2.5 flex items-center justify-between sticky top-0 z-40">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 font-black text-base">
        M
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-sm font-semibold tracking-wide text-slate-100">Miko Studio Slicer</h1>
          <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-medium">Production Suite</span>
        </div>
      </div>
    </div>

    <!-- TABS -->
    <div class="flex items-center bg-[#1e2027] border border-[#2b2d37] p-1 rounded-xl text-xs font-medium">
      <button id="tabDeconstruct" class="px-3.5 py-1.5 rounded-lg bg-amber-500/15 text-amber-300 font-semibold transition flex items-center gap-1.5">
        <i data-lucide="scissors" class="w-3.5 h-3.5"></i> 1. Pull & Deconstruct
      </button>
      <button id="tabCanvas" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition flex items-center gap-1.5">
        <i data-lucide="layers" class="w-3.5 h-3.5"></i> 2. Photoshop Canvas
      </button>
      <button id="tabLowerThird" class="px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition flex items-center gap-1.5">
        <i data-lucide="tv" class="w-3.5 h-3.5"></i> 3. Lower Third Studio
      </button>
    </div>

    <!-- ACTIONS -->
    <div class="flex items-center gap-2">
      <!-- Project Save & Load -->
      <button id="btnSaveProject" class="bg-[#20222a] hover:bg-[#282a35] text-xs font-medium text-slate-200 px-3 py-1.5 rounded-lg border border-[#2e313d] transition flex items-center gap-1.5" title="Save .mikoproj project file">
        <i data-lucide="save" class="w-3.5 h-3.5 text-amber-400"></i> Save Project
      </button>
      <label class="cursor-pointer bg-[#20222a] hover:bg-[#282a35] text-xs font-medium text-slate-200 px-3 py-1.5 rounded-lg border border-[#2e313d] transition flex items-center gap-1.5" title="Open .mikoproj project file">
        <i data-lucide="folder-open" class="w-3.5 h-3.5 text-indigo-400"></i> Open Project
        <input type="file" id="projectInput" accept=".mikoproj,.json" class="hidden">
      </label>
      <label class="cursor-pointer bg-[#20222a] hover:bg-[#282a35] text-xs font-medium text-slate-200 px-3 py-1.5 rounded-lg border border-[#2e313d] transition flex items-center gap-1.5">
        <i data-lucide="upload" class="w-3.5 h-3.5 text-cyan-400"></i> Upload Image
        <input type="file" id="fileInput" accept="image/*" class="hidden">
      </label>
      <button id="btnExportPSD" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-bold px-3.5 py-1.5 rounded-lg shadow-sm transition flex items-center gap-1.5">
        <i data-lucide="file-output" class="w-3.5 h-3.5"></i> Export .PSD
      </button>
    </div>
  </header>

  <!-- MAIN APP -->
  <main class="flex-1 flex overflow-hidden">
    <!-- VIEWPORT -->
    <div class="flex-1 flex flex-col p-4 overflow-hidden">
      <!-- Secondary Toolbar -->
      <div class="mb-3 flex items-center justify-between bg-[#18191f] border border-[#262833] px-4 py-2 rounded-xl text-xs">
        <div id="toolbarDeconstruct" class="flex items-center gap-2">
          <span class="text-slate-400 text-[11px]">Region Actions:</span>
          <button id="btnVectorizeRegion" class="px-2.5 py-1 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 flex items-center gap-1 font-semibold">
            <i data-lucide="bezier" class="w-3.5 h-3.5"></i> Vectorize Region
          </button>
          <button id="btnExtractTextOCR" class="px-2.5 py-1 rounded text-slate-300 hover:text-white border border-[#2c2f3d] flex items-center gap-1">
            <i data-lucide="type" class="w-3.5 h-3.5 text-indigo-400"></i> Extract Text (OCR)
          </button>
          <button id="btnCutoutAI" class="px-2.5 py-1 rounded text-slate-300 hover:text-white border border-[#2c2f3d] flex items-center gap-1">
            <i data-lucide="sparkles" class="w-3.5 h-3.5 text-emerald-400"></i> Cut Region (AI)
          </button>
        </div>

        <div id="toolbarCanvas" class="flex items-center gap-2 hidden">
          <!-- Undo / Redo -->
          <button id="btnUndo" class="p-1.5 rounded bg-[#20222a] border border-slate-700 text-slate-300 hover:text-white" title="Undo (Ctrl+Z)"><i data-lucide="undo-2" class="w-3.5 h-3.5"></i></button>
          <button id="btnRedo" class="p-1.5 rounded bg-[#20222a] border border-slate-700 text-slate-300 hover:text-white" title="Redo (Ctrl+Y)"><i data-lucide="redo-2" class="w-3.5 h-3.5"></i></button>
          <div class="h-4 w-px bg-slate-700 mx-1"></div>

          <!-- Group / Ungroup -->
          <button id="btnUngroup" class="px-2 py-1 rounded bg-[#20222a] border border-slate-700 text-slate-300 hover:text-white text-[11px] font-medium" title="Explode group into selectable paths">Ungroup Paths</button>
          <button id="btnGroup" class="px-2 py-1 rounded bg-[#20222a] border border-slate-700 text-slate-300 hover:text-white text-[11px] font-medium" title="Group selected elements">Group Selected</button>
          <div class="h-4 w-px bg-slate-700 mx-1"></div>

          <!-- Add Shapes Dropdown -->
          <div class="relative inline-block text-left">
            <button id="btnShapeMenu" class="px-2 py-1 rounded bg-[#20222a] border border-slate-700 text-slate-300 hover:text-white text-[11px] flex items-center gap-1">
              <i data-lucide="shapes" class="w-3.5 h-3.5 text-amber-400"></i> Add Shape <i data-lucide="chevron-down" class="w-3 h-3"></i>
            </button>
            <div id="shapeDropdown" class="hidden absolute left-0 mt-1 w-36 bg-[#1a1c24] border border-[#2b2d39] rounded-lg shadow-xl z-50 py-1 text-xs">
              <button onclick="addParametricShape('rect')" class="w-full text-left px-3 py-1.5 hover:bg-[#252835] text-slate-200">Rectangle</button>
              <button onclick="addParametricShape('rounded')" class="w-full text-left px-3 py-1.5 hover:bg-[#252835] text-slate-200">Rounded Box</button>
              <button onclick="addParametricShape('circle')" class="w-full text-left px-3 py-1.5 hover:bg-[#252835] text-slate-200">Circle</button>
              <button onclick="addParametricShape('triangle')" class="w-full text-left px-3 py-1.5 hover:bg-[#252835] text-slate-200">Triangle</button>
              <button onclick="addParametricShape('star')" class="w-full text-left px-3 py-1.5 hover:bg-[#252835] text-slate-200">Star (5-Point)</button>
              <button onclick="addParametricShape('polygon')" class="w-full text-left px-3 py-1.5 hover:bg-[#252835] text-slate-200">Hexagon</button>
            </div>
          </div>

          <!-- Freehand Draw Toggle -->
          <button id="btnToggleDraw" class="px-2 py-1 rounded bg-[#20222a] border border-slate-700 text-slate-300 hover:text-white text-[11px] flex items-center gap-1">
            <i data-lucide="pen-tool" class="w-3.5 h-3.5 text-indigo-400"></i> Draw Brush
          </button>

          <!-- Punch Out / Subtraction -->
          <button id="btnPunchOut" class="px-2 py-1 rounded bg-[#20222a] border border-slate-700 text-slate-300 hover:text-amber-400 text-[11px] flex items-center gap-1" title="Cut hole through artwork using active shape">
            <i data-lucide="scissors" class="w-3.5 h-3.5 text-red-400"></i> Punch Out
          </button>
        </div>

        <div id="toolbarLowerThird" class="flex items-center gap-2 hidden">
          <span class="text-slate-400 text-[11px]">SMPTE 1920x1080 Viewport</span>
          <button id="btnExport1080pPNG" class="px-3 py-1 rounded bg-amber-500 text-slate-950 font-bold hover:bg-amber-400 flex items-center gap-1">
            <i data-lucide="download" class="w-3.5 h-3.5"></i> Download 1080p Broadcast PNG
          </button>
        </div>

        <div id="statusText" class="text-slate-400 font-mono text-[11px]">Ready</div>
      </div>

      <!-- Stage Container -->
      <div class="flex-1 rounded-2xl border border-[#242631] checker-pattern relative overflow-auto flex items-center justify-center p-4">
        <!-- 1. Source Crop Canvas -->
        <canvas id="sourceCanvas" class="shadow-2xl max-w-full max-h-full cursor-crosshair rounded border border-slate-700/40"></canvas>

        <!-- 2. Photoshop Interactive Fabric Canvas -->
        <div id="fabricWrapper" class="hidden shadow-2xl rounded border border-slate-700/60 overflow-hidden">
          <canvas id="fabricCanvas" width="1280" height="720"></canvas>
        </div>

        <!-- 3. Broadcast Lower Third Studio -->
        <div id="lowerThirdStage" class="hidden relative border border-dashed border-indigo-500/40 bg-black/80 shadow-2xl flex items-end p-16" style="width: 1280px; height: 720px;">
          <div class="absolute inset-[10%] border border-cyan-500/30 pointer-events-none flex items-start justify-end p-2 text-[10px] font-mono text-cyan-400">
            TITLE SAFE (80%)
          </div>
          <div id="ltBannerBox" class="relative z-10 flex items-center gap-4 bg-[#0f172a] border border-amber-500/50 p-4 rounded-2xl shadow-2xl min-w-[540px]">
            <div id="ltIconSlot" class="w-20 h-20 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center overflow-hidden shrink-0">
              <i data-lucide="image" class="w-8 h-8 text-amber-400"></i>
            </div>
            <div class="flex-1">
              <div id="ltRoleDisplay" class="text-xs uppercase font-extrabold tracking-wider text-amber-400 mb-0.5">SPEAKER ROLE / TITLE</div>
              <div id="ltNameDisplay" class="text-2xl font-black tracking-tight text-white">SPEAKER NAME HERE</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: INSPECTOR & LAYERS -->
    <div class="w-80 border-l border-[#24252f] bg-[#18191f]/70 backdrop-blur p-4 flex flex-col justify-between overflow-y-auto">
      <div>
        <div class="flex items-center justify-between pb-3 border-b border-[#252733] mb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300">Property Inspector</h2>
          <span id="layerCountBadge" class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-full font-mono">0 Layers</span>
        </div>

        <!-- Dynamic Controls -->
        <div class="space-y-3 bg-[#14151a] p-3 rounded-xl border border-[#262834] text-xs">
          <!-- Fill Color -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-slate-400 text-[11px]">Fill Color:</label>
              <input type="text" id="propFillHex" value="#F59E0B" class="bg-[#1c1d24] border border-slate-700 px-1.5 py-0.5 rounded font-mono text-[10px] w-20 text-center text-slate-200">
            </div>
            <input type="color" id="propFillColor" value="#F59E0B" class="w-full h-7 rounded border border-slate-700 bg-transparent cursor-pointer">
          </div>

          <!-- Stroke Color & Width -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="text-slate-400 text-[11px]">Stroke:</label>
              <input type="color" id="propStrokeColor" value="#000000" class="w-6 h-6 rounded border border-slate-700 bg-transparent cursor-pointer">
            </div>
            <div class="flex items-center gap-2">
              <input type="range" id="propStrokeWidth" min="0" max="30" value="0" class="w-full accent-amber-500">
              <span id="strokeWidthVal" class="font-mono text-[11px] text-slate-400 w-6">0</span>
            </div>
          </div>

          <!-- Typography Controls -->
          <div id="textControls" class="space-y-2 pt-2 border-t border-slate-800">
            <div>
              <label class="text-slate-400 text-[11px]">Font Family:</label>
              <select id="propFontFamily" class="w-full bg-[#1c1d24] border border-slate-700 px-2 py-1 rounded text-xs text-white mt-0.5">
                <option value="Impact">Impact (Headline)</option>
                <option value="Arial">Arial</option>
                <option value="Montserrat">Montserrat</option>
                <option value="Georgia">Georgia</option>
                <option value="Courier New">Courier New</option>
              </select>
            </div>
            <div>
              <div class="flex items-center justify-between">
                <label class="text-slate-400 text-[11px]">Font Size:</label>
                <span id="fontSizeVal" class="font-mono text-[11px] text-slate-400">72</span>
              </div>
              <input type="range" id="propFontSize" min="8" max="250" value="72" class="w-full accent-amber-500">
            </div>
          </div>

          <!-- Layer Ordering -->
          <div class="pt-2 border-t border-slate-800 flex items-center justify-between gap-1 text-[11px]">
            <button id="btnBringForward" class="flex-1 bg-[#1e2029] hover:bg-[#282b37] border border-slate-700 py-1 rounded text-slate-300">Forward</button>
            <button id="btnSendBackward" class="flex-1 bg-[#1e2029] hover:bg-[#282b37] border border-slate-700 py-1 rounded text-slate-300">Backward</button>
            <button id="btnDeleteSelected" class="bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-400 px-2 py-1 rounded"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </div>
        </div>

        <!-- Layers Stack -->
        <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mt-4 mb-2">Canvas Layers</h3>
        <div id="layersList" class="space-y-1.5 max-h-56 overflow-y-auto pr-1"></div>
      </div>

      <!-- Export Footer -->
      <div class="pt-3 border-t border-[#252733] space-y-1.5">
        <button id="btnExportSVG" class="w-full bg-[#20222a] hover:bg-[#282a35] text-slate-200 text-xs font-semibold py-2 rounded-lg border border-[#2e313d] transition flex items-center justify-center gap-1.5">
          <i data-lucide="bezier" class="w-3.5 h-3.5 text-indigo-400"></i> Export SVG (.SVG)
        </button>
        <button id="btnExportZIP" class="w-full bg-[#20222a] hover:bg-[#282a35] text-slate-200 text-xs font-semibold py-2 rounded-lg border border-[#2e313d] transition flex items-center justify-center gap-1.5">
          <i data-lucide="archive" class="w-3.5 h-3.5 text-amber-400"></i> Export PNG Slices (.ZIP)
        </button>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();

    // 1. Setup Source Canvas
    const sCanvas = document.getElementById('sourceCanvas');
    const sCtx = sCanvas.getContext('2d');
    let sourceImg = new Image();
    let isDrawing = false;
    let startX = 0, startY = 0;
    let selectedCrop = null;

    // 2. Setup Fabric.js Interactive Canvas
    const fCanvas = new fabric.Canvas('fabricCanvas', {
      backgroundColor: '#12141A',
      preserveObjectStacking: true,
      fireRightClick: true
    });

    // 3. Undo / Redo Engine
    let undoStack = [];
    let redoStack = [];
    let isStateProcessing = false;

    function saveCanvasState() {
      if (isStateProcessing) return;
      const json = JSON.stringify(fCanvas.toJSON(['id', 'name', 'selectable', 'hasControls', 'subTargetCheck', 'globalCompositeOperation']));
      undoStack.push(json);
      if (undoStack.length > 40) undoStack.shift();
      redoStack = [];
    }

    fCanvas.on('object:modified', saveCanvasState);
    fCanvas.on('object:added', saveCanvasState);
    fCanvas.on('object:removed', saveCanvasState);

    function undo() {
      if (undoStack.length <= 1) return;
      isStateProcessing = true;
      redoStack.push(undoStack.pop());
      const prevState = undoStack[undoStack.length - 1];
      fCanvas.loadFromJSON(prevState, () => {
        fCanvas.renderAll();
        isStateProcessing = false;
        updateLayersUI();
      });
    }

    function redo() {
      if (redoStack.length === 0) return;
      isStateProcessing = true;
      const nextState = redoStack.pop();
      undoStack.push(nextState);
      fCanvas.loadFromJSON(nextState, () => {
        fCanvas.renderAll();
        isStateProcessing = false;
        updateLayersUI();
      });
    }

    document.getElementById('btnUndo').addEventListener('click', undo);
    document.getElementById('btnRedo').addEventListener('click', redo);

    // 4. Clipboard Engine
    let _clipboard = null;

    function copyActive() {
      const active = fCanvas.getActiveObject();
      if (!active) return;
      active.clone((cloned) => { _clipboard = cloned; });
    }

    function pasteActive() {
      if (!_clipboard) return;
      _clipboard.clone((clonedObj) => {
        fCanvas.discardActiveObject();
        clonedObj.set({ left: clonedObj.left + 15, top: clonedObj.top + 15, evented: true });
        if (clonedObj.type === 'activeSelection') {
          clonedObj.canvas = fCanvas;
          clonedObj.forEachObject((obj) => { fCanvas.add(obj); });
          clonedObj.setCoords();
        } else {
          fCanvas.add(clonedObj);
        }
        _clipboard.top += 15;
        _clipboard.left += 15;
        fCanvas.setActiveObject(clonedObj);
        fCanvas.renderAll();
        updateLayersUI();
      });
    }

    function cutActive() {
      copyActive();
      const active = fCanvas.getActiveObject();
      if (active) fCanvas.remove(active);
    }

    function duplicateActive() {
      copyActive();
      pasteActive();
    }

    function deleteActive() {
      const active = fCanvas.getActiveObject();
      if (!active) return;
      if (active.type === 'activeSelection') {
        active.forEachObject((obj) => fCanvas.remove(obj));
        fCanvas.discardActiveObject();
      } else {
        fCanvas.remove(active);
      }
      fCanvas.renderAll();
      updateLayersUI();
    }

    document.getElementById('btnDeleteSelected').addEventListener('click', deleteActive);

    // Global Keyboard Listeners
    window.addEventListener('keydown', (e) => {
      const activeEl = document.activeElement;
      if (activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) return;
      const activeObj = fCanvas.getActiveObject();
      if (activeObj && activeObj.isEditing) return;

      if (e.ctrlKey || e.metaKey) {
        if (e.key === 'c' || e.key === 'C') { e.preventDefault(); copyActive(); }
        else if (e.key === 'v' || e.key === 'V') { e.preventDefault(); pasteActive(); }
        else if (e.key === 'x' || e.key === 'X') { e.preventDefault(); cutActive(); }
        else if (e.key === 'd' || e.key === 'D') { e.preventDefault(); duplicateActive(); }
        else if (e.key === 'z' || e.key === 'Z') {
          e.preventDefault();
          if (e.shiftKey) redo(); else undo();
        }
        else if (e.key === 'y' || e.key === 'Y') { e.preventDefault(); redo(); }
      } else if (e.key === 'Delete' || e.key === 'Backspace') {
        e.preventDefault();
        deleteActive();
      } else if (e.key === 'Escape') {
        fCanvas.discardActiveObject();
        fCanvas.renderAll();
      } else if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && activeObj) {
        e.preventDefault();
        const step = e.shiftKey ? 10 : 1;
        if (e.key === 'ArrowUp') activeObj.top -= step;
        if (e.key === 'ArrowDown') activeObj.top += step;
        if (e.key === 'ArrowLeft') activeObj.left -= step;
        if (e.key === 'ArrowRight') activeObj.left += step;
        activeObj.setCoords();
        fCanvas.renderAll();
      }
    });

    // 5. Image Loading & Crop Handling
    sourceImg.onload = () => {
      sCanvas.width = sourceImg.width;
      sCanvas.height = sourceImg.height;
      redrawSource();
    };
    sourceImg.src = "sample_concept.png";

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        sourceImg = new Image();
        sourceImg.onload = () => {
          sCanvas.width = sourceImg.width;
          sCanvas.height = sourceImg.height;
          redrawSource();
          document.getElementById('statusText').innerText = `Loaded: ${file.name}`;
        };
        sourceImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    sCanvas.addEventListener('mousedown', (e) => {
      const rect = sCanvas.getBoundingClientRect();
      startX = (e.clientX - rect.left) * (sCanvas.width / rect.width);
      startY = (e.clientY - rect.top) * (sCanvas.height / rect.height);
      isDrawing = true;
    });

    sCanvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      const rect = sCanvas.getBoundingClientRect();
      const curX = (e.clientX - rect.left) * (sCanvas.width / rect.width);
      const curY = (e.clientY - rect.top) * (sCanvas.height / rect.height);

      redrawSource();
      sCtx.strokeStyle = '#f59e0b';
      sCtx.lineWidth = 2;
      sCtx.strokeRect(startX, startY, curX - startX, curY - startY);
    });

    sCanvas.addEventListener('mouseup', (e) => {
      if (!isDrawing) return;
      isDrawing = false;
      const rect = sCanvas.getBoundingClientRect();
      const endX = (e.clientX - rect.left) * (sCanvas.width / rect.width);
      const endY = (e.clientY - rect.top) * (sCanvas.height / rect.height);

      const x = Math.round(Math.min(startX, endX));
      const y = Math.round(Math.min(startY, endY));
      const w = Math.round(Math.abs(endX - startX));
      const h = Math.round(Math.abs(endY - startY));

      if (w > 15 && h > 15) {
        selectedCrop = { x, y, w, h };
        document.getElementById('statusText').innerText = `Selected region: ${w}x${h}px`;
      }
      redrawSource();
    });

    function redrawSource() {
      sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
      sCtx.drawImage(sourceImg, 0, 0);
      if (selectedCrop) {
        sCtx.strokeStyle = '#f59e0b';
        sCtx.lineWidth = 2;
        sCtx.strokeRect(selectedCrop.x, selectedCrop.y, selectedCrop.w, selectedCrop.h);
      }
    }

    function getCroppedBase64() {
      const crop = selectedCrop || { x: 0, y: 0, w: sCanvas.width, h: sCanvas.height };
      const tempC = document.createElement('canvas');
      tempC.width = crop.w;
      tempC.height = crop.h;
      tempC.getContext('2d').drawImage(sourceImg, crop.x, crop.y, crop.w, crop.h, 0, 0, crop.w, crop.h);
      return { b64: tempC.toDataURL('image/png'), bounds: crop };
    }

    // 6. Vectorize Region Pipeline (Assembled Grouping)
    document.getElementById('btnVectorizeRegion').addEventListener('click', async () => {
      const { b64, bounds } = getCroppedBase64();
      document.getElementById('statusText').innerText = "Vectorizing color boundaries via vtracer...";

      try {
        const resp = await fetch('/api/vectorize', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: b64 })
        });
        const data = await resp.json();
        if (data.success && data.svg) {
          fabric.loadSVGFromString(data.svg, (objects, options) => {
            if (!objects || objects.length === 0) return;

            // Filter out full-frame background bounding box
            const valid = objects.filter(o => !(o.width >= bounds.w * 0.96 && o.height >= bounds.h * 0.96));
            const items = valid.length > 0 ? valid : objects;

            // Group paths and center on canvas at readable proportions
            const group = fabric.util.groupSVGElements(items, options);
            group.scaleToWidth(Math.min(450, fCanvas.getWidth() * 0.6));
            group.set({
              left: fCanvas.getWidth() / 2,
              top: fCanvas.getHeight() / 2,
              originX: 'center',
              originY: 'center',
              name: `Vector Artwork (${items.length} paths)`
            });

            fCanvas.add(group);
            fCanvas.setActiveObject(group);
            fCanvas.renderAll();
            saveCanvasState();
            switchTab('canvas');
            updateLayersUI();
            document.getElementById('statusText').innerText = `Assembled ${items.length} vector paths cleanly!`;
          });
        } else {
          alert('Vectorize error: ' + (data.error || 'Server failed to vectorize.'));
        }
      } catch (err) {
        alert('Could not connect to /api/vectorize. Ensure server.py is running.');
      }
    });

    // Ungroup & Group Buttons
    document.getElementById('btnUngroup').addEventListener('click', () => {
      const active = fCanvas.getActiveObject();
      if (!active || active.type !== 'group') return;
      active.toActiveSelection();
      // Lock every child's world-space position after ungrouping
      fCanvas.getActiveObject().forEachObject(obj => {
        obj.setCoords();
      });
      fCanvas.requestRenderAll();
      saveCanvasState();
      updateLayersUI();
      document.getElementById('statusText').innerText = "Ungrouped into selectable paths!";
    });

    document.getElementById('btnGroup').addEventListener('click', () => {
      const active = fCanvas.getActiveObject();
      if (!active || active.type !== 'activeSelection') return;
      active.toGroup();
      fCanvas.requestRenderAll();
      updateLayersUI();
      document.getElementById('statusText').innerText = "Grouped selected elements!";
    });

    // 7. OCR Text Extraction Pipeline
    document.getElementById('btnExtractTextOCR').addEventListener('click', async () => {
      const { b64, bounds } = getCroppedBase64();
      document.getElementById('statusText').innerText = "Running Tesseract OCR recognition...";

      try {
        const resp = await fetch('/api/ocr', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: b64 })
        });
        const data = await resp.json();
        const textStr = (data.success && data.text) ? data.text : (prompt("Enter text for layer:") || "TEXT");
        
        const iText = new fabric.IText(textStr, {
          left: 200,
          top: 200,
          fontFamily: 'Impact',
          fontSize: data.fontSize || 72,
          fill: data.fill || '#F59E0B',
          name: `Text: ${textStr}`
        });

        fCanvas.add(iText);
        fCanvas.setActiveObject(iText);
        fCanvas.renderAll();
        switchTab('canvas');
        updateLayersUI();
        document.getElementById('statusText').innerText = `Extracted text layer: "${textStr}"`;
      } catch (err) {
        const textStr = prompt("OCR offline. Enter text for layer:") || "TEXT";
        const iText = new fabric.IText(textStr, { left: 200, top: 200, fontFamily: 'Impact', fontSize: 72, fill: '#F59E0B', name: `Text: ${textStr}` });
        fCanvas.add(iText);
        fCanvas.setActiveObject(iText);
        fCanvas.renderAll();
        switchTab('canvas');
      }
    });

    // 8. AI Neural Cutout Pipeline
    document.getElementById('btnCutoutAI').addEventListener('click', async () => {
      const { b64 } = getCroppedBase64();
      document.getElementById('statusText').innerText = "Running local u2net background isolation...";

      try {
        const resp = await fetch('/api/ai_segment', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: b64 })
        });
        const data = await resp.json();
        if (data.success && data.image) {
          fabric.Image.fromURL(data.image, (img) => {
            img.set({ left: 200, top: 150, name: "AI Cutout Layer" });
            fCanvas.add(img);
            fCanvas.setActiveObject(img);
            fCanvas.renderAll();
            switchTab('canvas');
            updateLayersUI();
            document.getElementById('statusText').innerText = "AI Cutout layer generated!";
          });
        }
      } catch (err) {
        alert("Failed to reach /api/ai_segment.");
      }
    });

    // 9. Shapes Library & Freehand Drawing
    document.getElementById('btnShapeMenu').addEventListener('click', () => {
      document.getElementById('shapeDropdown').classList.toggle('hidden');
    });

    window.addParametricShape = (type) => {
      document.getElementById('shapeDropdown').classList.add('hidden');
      const fill = document.getElementById('propFillColor').value;
      const stroke = document.getElementById('propStrokeColor').value;
      const strokeWidth = parseInt(document.getElementById('propStrokeWidth').value, 10);

      let shape;
      if (type === 'rect') shape = new fabric.Rect({ width: 140, height: 90, fill, stroke, strokeWidth });
      else if (type === 'rounded') shape = new fabric.Rect({ width: 140, height: 90, rx: 16, ry: 16, fill, stroke, strokeWidth });
      else if (type === 'circle') shape = new fabric.Circle({ radius: 50, fill, stroke, strokeWidth });
      else if (type === 'triangle') shape = new fabric.Triangle({ width: 110, height: 100, fill, stroke, strokeWidth });
      else if (type === 'star') {
        const pts = [{x: 50, y: 0}, {x: 65, y: 35}, {x: 100, y: 35}, {x: 72, y: 57}, {x: 82, y: 91}, {x: 50, y: 70}, {x: 18, y: 91}, {x: 28, y: 57}, {x: 0, y: 35}, {x: 35, y: 35}];
        shape = new fabric.Polygon(pts, { fill, stroke, strokeWidth });
      } else if (type === 'polygon') {
        const pts = [{x: 40, y: 0}, {x: 80, y: 0}, {x: 110, y: 45}, {x: 80, y: 90}, {x: 40, y: 90}, {x: 10, y: 45}];
        shape = new fabric.Polygon(pts, { fill, stroke, strokeWidth });
      }

      shape.set({ left: 300, top: 200, name: `Shape (${type})` });
      fCanvas.add(shape);
      fCanvas.setActiveObject(shape);
      fCanvas.renderAll();
      updateLayersUI();
    };

    document.getElementById('btnToggleDraw').addEventListener('click', () => {
      fCanvas.isDrawingMode = !fCanvas.isDrawingMode;
      if (fCanvas.isDrawingMode) {
        fCanvas.freeDrawingBrush.width = parseInt(document.getElementById('propStrokeWidth').value, 10) || 5;
        fCanvas.freeDrawingBrush.color = document.getElementById('propStrokeColor').value || '#F59E0B';
      }
      document.getElementById('btnToggleDraw').classList.toggle('bg-amber-500/20', fCanvas.isDrawingMode);
    });

    document.getElementById('btnPunchOut').addEventListener('click', () => {
      const active = fCanvas.getActiveObject();
      if (!active) return alert("Select a top shape to punch out through underlying layers.");
      active.set('globalCompositeOperation', 'destination-out');
      fCanvas.requestRenderAll();
      saveCanvasState();
      document.getElementById('statusText').innerText = "Punch-out applied to active shape!";
    });

    // 10. Project Save & Load Engine (.mikoproj)
    document.getElementById('btnSaveProject').addEventListener('click', () => {
      const proj = fCanvas.toJSON(['id', 'name', 'selectable', 'hasControls', 'subTargetCheck', 'globalCompositeOperation']);
      const blob = new Blob([JSON.stringify(proj, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `MikoStudio_Project_${Date.now()}.mikoproj`;
      a.click();
    });

    document.getElementById('projectInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        fCanvas.loadFromJSON(evt.target.result, () => {
          fCanvas.renderAll();
          switchTab('canvas');
          updateLayersUI();
          document.getElementById('statusText').innerText = `Loaded project: ${file.name}`;
        });
      };
      reader.readAsText(file);
    });

    // 11. Property Inspector Two-Way Sync
    fCanvas.on('selection:created', syncInspector);
    fCanvas.on('selection:updated', syncInspector);

    function syncInspector() {
      const active = fCanvas.getActiveObject();
      if (!active) return;
      if (active.fill && typeof active.fill === 'string') {
        document.getElementById('propFillColor').value = active.fill;
        document.getElementById('propFillHex').value = active.fill.toUpperCase();
      }
      if (active.stroke && typeof active.stroke === 'string') {
        document.getElementById('propStrokeColor').value = active.stroke;
      }
      document.getElementById('propStrokeWidth').value = active.strokeWidth || 0;
      document.getElementById('strokeWidthVal').innerText = active.strokeWidth || 0;

      if (active.type.includes('text')) {
        document.getElementById('propFontSize').value = active.fontSize || 72;
        document.getElementById('fontSizeVal').innerText = active.fontSize || 72;
        document.getElementById('propFontFamily').value = active.fontFamily || 'Impact';
      }
    }

    document.getElementById('propFillColor').addEventListener('input', (e) => {
      const val = e.target.value;
      document.getElementById('propFillHex').value = val.toUpperCase();
      const active = fCanvas.getActiveObject();
      if (active) { active.set('fill', val); fCanvas.renderAll(); }
    });

    document.getElementById('propFillHex').addEventListener('change', (e) => {
      const val = e.target.value;
      document.getElementById('propFillColor').value = val;
      const active = fCanvas.getActiveObject();
      if (active) { active.set('fill', val); fCanvas.renderAll(); }
    });

    document.getElementById('propStrokeColor').addEventListener('input', (e) => {
      const val = e.target.value;
      const active = fCanvas.getActiveObject();
      if (active) { active.set('stroke', val); fCanvas.renderAll(); }
    });

    document.getElementById('propStrokeWidth').addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      document.getElementById('strokeWidthVal').innerText = val;
      const active = fCanvas.getActiveObject();
      if (active) { active.set('strokeWidth', val); fCanvas.renderAll(); }
    });

    document.getElementById('propFontSize').addEventListener('input', (e) => {
      const val = parseInt(e.target.value, 10);
      document.getElementById('fontSizeVal').innerText = val;
      const active = fCanvas.getActiveObject();
      if (active && active.type.includes('text')) { active.set('fontSize', val); fCanvas.renderAll(); }
    });

    document.getElementById('propFontFamily').addEventListener('change', (e) => {
      const val = e.target.value;
      const active = fCanvas.getActiveObject();
      if (active && active.type.includes('text')) { active.set('fontFamily', val); fCanvas.renderAll(); }
    });

    // Z-Ordering
    document.getElementById('btnBringForward').addEventListener('click', () => {
      const active = fCanvas.getActiveObject();
      if (active) { fCanvas.bringForward(active); updateLayersUI(); }
    });
    document.getElementById('btnSendBackward').addEventListener('click', () => {
      const active = fCanvas.getActiveObject();
      if (active) { fCanvas.sendBackwards(active); updateLayersUI(); }
    });

    // 12. Layers List UI
    function updateLayersUI() {
      const container = document.getElementById('layersList');
      const objects = fCanvas.getObjects();
      document.getElementById('layerCountBadge').innerText = `${objects.length} Layers`;

      container.innerHTML = '';
      objects.slice().reverse().forEach((obj, idx) => {
        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-2 rounded-lg bg-[#1c1d24] border border-[#2b2d39] text-xs hover:border-slate-600 transition cursor-pointer";
        row.innerHTML = `
          <div class="flex items-center gap-1.5 truncate">
            <span class="w-2.5 h-2.5 rounded-full border border-white/20 shrink-0" style="background-color: ${obj.fill || '#fff'}"></span>
            <span class="truncate font-medium text-slate-200 text-[11px]">${obj.name || obj.type}</span>
          </div>
          <button onclick="mountToLowerThird(this)" class="text-[10px] bg-indigo-500/20 text-indigo-300 px-1 py-0.5 rounded border border-indigo-500/30">Make LT</button>
        `;
        row.onclick = (e) => {
          if (e.target.tagName !== 'BUTTON') {
            fCanvas.setActiveObject(obj);
            fCanvas.renderAll();
          }
        };
        container.appendChild(row);
      });
    }

    window.mountToLowerThird = (btn) => {
      const idx = Array.from(btn.closest('#layersList').children).indexOf(btn.closest('div'));
      const obj = fCanvas.getObjects().slice().reverse()[idx];
      if (!obj) return;

      switchTab('lowerthird');
      const slot = document.getElementById('ltIconSlot');
      slot.innerHTML = `<img src="${obj.toDataURL()}" class="max-w-full max-h-full object-contain">`;
      document.getElementById('statusText').innerText = `Mounted ${obj.name} as lower-third badge.`;
    };

    // 13. Tab Navigation
    document.getElementById('tabDeconstruct').addEventListener('click', () => switchTab('deconstruct'));
    document.getElementById('tabCanvas').addEventListener('click', () => switchTab('canvas'));
    document.getElementById('tabLowerThird').addEventListener('click', () => switchTab('lowerthird'));

    function switchTab(t) {
      ['tabDeconstruct', 'tabCanvas', 'tabLowerThird'].forEach(id => {
        document.getElementById(id).className = "px-3.5 py-1.5 rounded-lg text-slate-400 hover:text-slate-200 transition flex items-center gap-1.5";
      });

      document.getElementById('toolbarDeconstruct').classList.add('hidden');
      document.getElementById('toolbarCanvas').classList.add('hidden');
      document.getElementById('toolbarLowerThird').classList.add('hidden');

      sCanvas.classList.add('hidden');
      document.getElementById('fabricWrapper').classList.add('hidden');
      document.getElementById('lowerThirdStage').classList.add('hidden');

      if (t === 'deconstruct') {
        document.getElementById('tabDeconstruct').className = "px-3.5 py-1.5 rounded-lg bg-amber-500/15 text-amber-300 font-semibold transition flex items-center gap-1.5";
        document.getElementById('toolbarDeconstruct').classList.remove('hidden');
        sCanvas.classList.remove('hidden');
      } else if (t === 'canvas') {
        document.getElementById('tabCanvas').className = "px-3.5 py-1.5 rounded-lg bg-amber-500/15 text-amber-300 font-semibold transition flex items-center gap-1.5";
        document.getElementById('toolbarCanvas').classList.remove('hidden');
        document.getElementById('fabricWrapper').classList.remove('hidden');
        fCanvas.renderAll();
      } else if (t === 'lowerthird') {
        document.getElementById('tabLowerThird').className = "px-3.5 py-1.5 rounded-lg bg-amber-500/15 text-amber-300 font-semibold transition flex items-center gap-1.5";
        document.getElementById('toolbarLowerThird').classList.remove('hidden');
        document.getElementById('lowerThirdStage').classList.remove('hidden');
      }
    }

    // 14. Export Pipelines
    document.getElementById('btnExportPSD').addEventListener('click', () => {
      const objects = fCanvas.getObjects();
      if (objects.length === 0) return alert('No layers to export.');
      document.getElementById('statusText').innerText = "Compiling multi-layer PSD...";

      const psdDoc = { width: 1280, height: 720, children: [] };
      objects.forEach((obj, idx) => {
        if (!obj.visible) return;
        const b = obj.getBoundingRect();
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = Math.max(1, Math.round(b.width));
        tempCanvas.height = Math.max(1, Math.round(b.height));

        const tCtx = tempCanvas.getContext('2d');
        const img = new Image();
        img.onload = () => { tCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height); };
        img.src = obj.toDataURL();

        psdDoc.children.push({
          name: obj.name || `Layer_${idx + 1}`,
          top: Math.max(0, Math.round(b.top)),
          left: Math.max(0, Math.round(b.left)),
          bottom: Math.min(720, Math.round(b.top + b.height)),
          right: Math.min(1280, Math.round(b.left + b.width)),
          canvas: tempCanvas,
          opacity: 1
        });
      });

      const buffer = agPsd.writePsd(psdDoc);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buffer], { type: 'application/octet-stream' }));
      a.download = 'MikoStudio_Master.psd';
      a.click();
      document.getElementById('statusText').innerText = "Exported MikoStudio_Master.psd!";
    });

    document.getElementById('btnExportSVG').addEventListener('click', () => {
      const svg = fCanvas.toSVG();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
      a.download = 'MikoStudio_Vector.svg';
      a.click();
    });

    document.getElementById('btnExportZIP').addEventListener('click', async () => {
      const objects = fCanvas.getObjects();
      if (objects.length === 0) return alert('No layers to export.');
      const zip = new JSZip();
      objects.forEach((obj, i) => {
        const data = obj.toDataURL().split(',')[1];
        zip.file(`${obj.name || 'Layer_' + (i+1)}.png`, data, { base64: true });
      });
      const blob = await zip.generateAsync({ type: 'blob' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'MikoStudio_Slices.zip';
      a.click();
    });

    document.getElementById('btnExport1080pPNG').addEventListener('click', () => {
      const outC = document.createElement('canvas');
      outC.width = 1920; outC.height = 1080;
      const oCtx = outC.getContext('2d');

      const bannerX = 140, bannerY = 840, bannerW = 920, bannerH = 120;
      oCtx.fillStyle = '#0f172a';
      oCtx.fillRect(bannerX, bannerY, bannerW, bannerH);
      oCtx.strokeStyle = '#f59e0b';
      oCtx.lineWidth = 3;
      oCtx.strokeRect(bannerX, bannerY, bannerW, bannerH);

      oCtx.fillStyle = '#f59e0b';
      oCtx.fillRect(bannerX, bannerY - 35, 460, 35);
      oCtx.fillStyle = '#0f172a';
      oCtx.font = "900 16px 'Segoe UI', system-ui, sans-serif";
      oCtx.fillText("SPEAKER ROLE / TITLE", bannerX + 25, bannerY - 12);

      oCtx.fillStyle = '#ffffff';
      oCtx.font = "bold 44px 'Segoe UI', system-ui, sans-serif";
      oCtx.fillText("SPEAKER NAME HERE", bannerX + 130, bannerY + 75);

      const a = document.createElement('a');
      a.href = outC.toDataURL('image/png');
      a.download = 'MikoStudio_LowerThird_1080p.png';
      a.click();
    });
  </script>
</body>
</html>
