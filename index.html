<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Miko Studio Slicer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="vendor/tailwind.js"></script>
<script src="vendor/fabric.min.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="vendor/ag-psd.js"></script>
<script src="vendor/lucide.min.js"></script>
<style>
:root{--bg:#121316;--panel:#1a1c21;--line:#2a2d35;--gold:#d4a64a;--txt:#e6e7ea;--dim:#8d919c}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:28px;padding:0 18px;height:52px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:700;font-size:17px;letter-spacing:.2px}.brand b{color:var(--gold)}
.tabbtn{background:none;border:0;color:var(--dim);font:inherit;padding:15px 2px;border-bottom:2px solid transparent;cursor:pointer}
.tabbtn.on{color:var(--txt);border-color:var(--gold)}
.tab{display:none;flex:1;min-height:0}.tab.on{display:flex}
.side{width:230px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.side.r{border-right:0;border-left:1px solid var(--line)}
.stage{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:8px}
.canvas-container{background:conic-gradient(#2a2d35 25%,#23252b 0 50%,#2a2d35 0 75%,#23252b 0) 0 0/20px 20px;box-shadow:0 0 0 1px var(--line)}
.btn{display:flex;align-items:center;gap:8px;background:#23262d;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer;text-align:left}
.btn:hover{border-color:var(--gold)}.btn.gold{background:var(--gold);color:#121316;border-color:var(--gold);font-weight:600}
.btn svg{width:16px;height:16px;flex:none}
.btn:disabled{opacity:.45;pointer-events:none}
input[type=text],input[type=number]{background:#0e0f12;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:7px 8px;font:inherit;font-size:13px;width:100%}
input[type=color]{width:100%;height:32px;background:none;border:1px solid var(--line);border-radius:6px;padding:2px}
.lbl{font-size:12px;color:var(--dim)}
.divider{border-top:1px solid var(--line);margin:4px 0}
.lyr{padding:6px 8px;border-radius:5px;font-size:13px;cursor:pointer;border:1px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyr:hover{background:#23262d}.lyr.on{border-color:var(--gold);background:#23262d}
.lyr .ico{display:inline-block;width:18px;text-align:center;font-size:11px;margin-right:4px;opacity:.7}
footer{height:30px;display:flex;align-items:center;gap:10px;padding:0 18px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--dim)}
#dot{width:8px;height:8px;border-radius:50%;background:#c0453a}#dot.ok{background:#4fae6b}
</style></head>
<body>
<header>
  <div class="brand">Miko <b>Studio Slicer</b></div>
  <nav class="flex gap-6">
    <button class="tabbtn on" data-t="t1">Pull &amp; Deconstruct</button>
    <button class="tabbtn" data-t="t2">Photoshop Canvas</button>
    <button class="tabbtn" data-t="t3">Lower Third Studio</button>
  </nav>
</header>

<section id="t1" class="tab on">
  <div class="side">
    <label class="btn"><i data-lucide="image-plus"></i>Open image<input id="file" type="file" accept="image/*" hidden></label>
    <button class="btn" id="sample"><i data-lucide="file-image"></i>Load sample</button>
    <div class="lbl mt-2">Drag on the image to mark a region. No region uses the whole image.</div>
    <button class="btn" id="clr"><i data-lucide="square-dashed"></i>Clear region</button>

    <div class="divider"></div>
    <div class="lbl" style="font-weight:600;color:var(--gold)">AI Extraction</div>
    <button class="btn gold" id="cut"><i data-lucide="scissors"></i>Cut region (AI)</button>
    <button class="btn gold" id="split"><i data-lucide="layers"></i>Auto-split layers (AI)</button>

    <div class="divider"></div>
    <div class="lbl" style="font-weight:600;color:var(--gold)">Vector & Text</div>
    <button class="btn gold" id="vec"><i data-lucide="pen-tool"></i>Vectorize region</button>
    <button class="btn gold" id="ocr"><i data-lucide="scan-text"></i>Extract text (OCR)</button>
  </div>
  <div class="stage" id="s1"><canvas id="c1"></canvas></div>
</section>

<section id="t2" class="tab">
  <div class="side">
    <div class="lbl">Fill</div><input type="color" id="col" value="#d4a64a">
    <div class="lbl">Stroke</div><input type="color" id="scol" value="#000000">
    <div class="lbl">Stroke width</div><input type="number" id="sw" value="0" min="0" max="50">
    <div class="lbl">Text size</div><input type="number" id="fs" value="72" min="6" max="600">
    <div class="divider"></div>
    <button class="btn" id="addText"><i data-lucide="type"></i>Add live text</button>
    <button class="btn" id="addRect"><i data-lucide="square"></i>Add vector shape</button>
    <div class="divider"></div>
    <button class="btn" id="up"><i data-lucide="arrow-up"></i>Bring forward</button>
    <button class="btn" id="down"><i data-lucide="arrow-down"></i>Send backward</button>
    <button class="btn" id="del"><i data-lucide="trash-2"></i>Delete</button>
    <div class="divider"></div>
    <button class="btn gold" id="psd2"><i data-lucide="download"></i>Export PSD</button>
    <button class="btn" id="zip2"><i data-lucide="archive"></i>Export PNG layers (ZIP)</button>
  </div>
  <div class="stage" id="s2"><canvas id="c2"></canvas></div>
  <div class="side r"><div class="lbl">Layers (top first)</div><div id="layers"></div></div>
</section>

<section id="t3" class="tab">
  <div class="side">
    <div class="lbl">Name</div><input type="text" id="nm" value="Miko Tanaka">
    <div class="lbl">Title</div><input type="text" id="ti" value="Lead Character Artist">
    <div class="lbl">Accent</div><input type="color" id="acc" value="#d4a64a">
    <button class="btn gold" id="build"><i data-lucide="rectangle-horizontal"></i>Build nameplate</button>
    <button class="btn" id="png3"><i data-lucide="image"></i>Export PNG (1920×1080)</button>
    <button class="btn" id="psd3"><i data-lucide="download"></i>Export PSD</button>
  </div>
  <div class="stage" id="s3"><canvas id="c3"></canvas></div>
</section>

<footer><span id="dot"></span><span id="srv">Server offline</span><span style="margin-left:auto" id="msg">Open an image to begin.</span></footer>

<script>
/* ------------------------------------------------------------------ */
/*  Globals                                                           */
/* ------------------------------------------------------------------ */
const $=s=>document.querySelector(s), msg=t=>$('#msg').textContent=t;
let src=null, doc={w:1920,h:1080}, seq=0;
const c1=new fabric.Canvas('c1',{selection:false}),
      c2=new fabric.Canvas('c2',{preserveObjectStacking:true}),
      c3=new fabric.Canvas('c3',{preserveObjectStacking:true});
c1._l={w:1280,h:720};c2._l=doc;c3._l={w:1920,h:1080};
const stage={c1:'#s1',c2:'#s2',c3:'#s3'};
function fit(c){const s=$(stage[c.lowerCanvasEl.id]);if(!s.clientWidth)return;
  const z=Math.min((s.clientWidth-16)/c._l.w,(s.clientHeight-16)/c._l.h,1);
  c.setZoom(z);c.setDimensions({width:c._l.w*z,height:c._l.h*z});c.requestRenderAll();}
const fitAll=()=>[c1,c2,c3].forEach(fit);
addEventListener('resize',fitAll);

/* ------------------------------------------------------------------ */
/*  Tab switching                                                     */
/* ------------------------------------------------------------------ */
document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabbtn,.tab').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');$('#'+b.dataset.t).classList.add('on');fitAll();});

/* ------------------------------------------------------------------ */
/*  Tab 1 — Source image + marquee selection                          */
/* ------------------------------------------------------------------ */
function loadSrc(url){const im=new Image();im.onload=()=>{
  src=im;doc={w:im.naturalWidth,h:im.naturalHeight};c1._l=doc;c1.clear();sel=null;
  c1.setBackgroundImage(new fabric.Image(im),()=>{});
  if(!c2.getObjects().length){c2._l=doc;}
  fitAll();msg(`Loaded ${doc.w}×${doc.h}.`);};im.src=url;}
$('#file').onchange=e=>e.target.files[0]&&loadSrc(URL.createObjectURL(e.target.files[0]));
$('#sample').onclick=()=>loadSrc('sample_concept.png');
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];f&&loadSrc(URL.createObjectURL(f));});
let sel=null,st=null;
c1.on('mouse:down',o=>{if(!src)return;st=c1.getPointer(o.e);if(sel)c1.remove(sel);
  sel=new fabric.Rect({left:st.x,top:st.y,width:0,height:0,fill:'rgba(212,166,74,.15)',stroke:'#d4a64a',strokeWidth:2,strokeUniform:true,strokeDashArray:[8,6],selectable:false,evented:false});c1.add(sel);});
c1.on('mouse:move',o=>{if(!st)return;const p=c1.getPointer(o.e);
  sel.set({left:Math.min(p.x,st.x),top:Math.min(p.y,st.y),width:Math.abs(p.x-st.x),height:Math.abs(p.y-st.y)});c1.requestRenderAll();});
c1.on('mouse:up',()=>{st=null;if(sel&&(sel.width<4||sel.height<4)){c1.remove(sel);sel=null;}});
$('#clr').onclick=()=>{if(sel)c1.remove(sel);sel=null;};
function region(){if(!sel)return{x:0,y:0,w:doc.w,h:doc.h};
  const x=Math.max(0,Math.round(sel.left)),y=Math.max(0,Math.round(sel.top));
  return{x,y,w:Math.min(doc.w-x,Math.round(sel.width)),h:Math.min(doc.h-y,Math.round(sel.height))};}
function crop(r){const k=document.createElement('canvas');k.width=r.w;k.height=r.h;
  k.getContext('2d').drawImage(src,r.x,r.y,r.w,r.h,0,0,r.w,r.h);return k.toDataURL('image/png');}

/* ------------------------------------------------------------------ */
/*  AI segment — neural cutout / auto-split (rembg + u2net)           */
/* ------------------------------------------------------------------ */
async function ai(mode){
  if(!src)return msg('Open an image first.');
  const r=region();msg('Segmenting… the first run loads the model.');
  try{
    const res=await fetch('/api/ai_segment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:crop(r),mode})});
    const j=await res.json();if(!res.ok)throw new Error(j.error);
    if(!j.layers.length)return msg('No foreground found in that region.');
    if(!c2.getObjects().length){c2._l=doc;}
    await Promise.all(j.layers.map(l=>new Promise(ok=>fabric.Image.fromURL(l.png,im=>{
      im.set({left:r.x+l.x,top:r.y+l.y,name:l.name+' '+(++seq)});c2.add(im);ok();}))));
    fitAll();msg(`${j.layers.length} layer(s) added to Photoshop Canvas.`);
  }catch(e){msg('AI error: '+e.message);}}
$('#cut').onclick=()=>ai('cutout');$('#split').onclick=()=>ai('split');

/* ------------------------------------------------------------------ */
/*  Vectorize region — raster → Bézier <path> decomposition          */
/* ------------------------------------------------------------------ */
async function vectorizeRegion(){
  if(!src)return msg('Open an image first.');
  const r=region();msg('Vectorizing… tracing colour boundaries.');
  try{
    const res=await fetch('/api/vectorize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:crop(r)})});
    const j=await res.json();if(!res.ok)throw new Error(j.error);
    if(!j.paths||!j.paths.length)return msg('No vector paths found in that region.');
    if(!c2.getObjects().length){c2._l=doc;}
    j.paths.forEach(p=>{
      const path=new fabric.Path(p.d,{
        fill:p.fill,stroke:'',strokeWidth:0,
        opacity:p.opacity||1,
        name:p.name+' '+(++seq),
        selectable:true,evented:true,strokeUniform:true
      });
      /* Apply viewBox scaling if needed */
      if(p.scaleX&&p.scaleX!==1)path.set({scaleX:p.scaleX});
      if(p.scaleY&&p.scaleY!==1)path.set({scaleY:p.scaleY});
      /* Offset by the selected region on the source image */
      path.set({left:(path.left||0)+r.x,top:(path.top||0)+r.y});
      path.setCoords();
      c2.add(path);
    });
    fitAll();msg(`${j.paths.length} vector path(s) added to Photoshop Canvas.`);
  }catch(e){msg('Vectorize error: '+e.message);}}
$('#vec').onclick=vectorizeRegion;

/* ------------------------------------------------------------------ */
/*  OCR text extraction — pytesseract → fabric.IText                  */
/* ------------------------------------------------------------------ */
async function extractOCR(){
  if(!src)return msg('Open an image first.');
  const r=region();msg('Extracting text… running OCR.');
  try{
    const res=await fetch('/api/ocr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:crop(r)})});
    const j=await res.json();if(!res.ok)throw new Error(j.error);
    if(!j.texts||!j.texts.length)return msg('No text found in that region.');
    if(!c2.getObjects().length){c2._l=doc;}
    j.texts.forEach(t=>{
      const txt=new fabric.IText(t.text,{
        left:r.x+t.x,top:r.y+t.y,
        fontFamily:'Arial',fontSize:t.fontSize,
        fill:t.fill,
        name:t.name+' '+(++seq)
      });
      c2.add(txt);
    });
    fitAll();msg(`${j.texts.length} text block(s) added to Photoshop Canvas.`);
  }catch(e){msg('OCR error: '+e.message);}}
$('#ocr').onclick=extractOCR;

/* ------------------------------------------------------------------ */
/*  Tab 2 — Photoshop Canvas editing                                  */
/* ------------------------------------------------------------------ */

/* Colour / hex helper */
function hexCol(c){
  if(!c)return'#000000';
  if(/^#[0-9a-f]{6}$/i.test(c))return c;
  try{const s=new fabric.Color(c).getSource();
    return'#'+[s[0],s[1],s[2]].map(v=>(v|0).toString(16).padStart(2,'0')).join('');}
  catch(e){return'#000000';}}

/* Layer type icons */
function typeIcon(o){
  if(o.type==='image')return'📷';
  if(o.type==='path')return'✏️';
  if(o.type==='i-text')return'T';
  if(o.type==='rect')return'▪';
  return'●';}

/* Layer panel refresh */
function refresh(){const l=$('#layers');l.innerHTML='';const a=c2.getActiveObject();
  c2.getObjects().slice().reverse().forEach(o=>{const d=document.createElement('div');
    d.className='lyr'+(o===a?' on':'');
    d.innerHTML='<span class="ico">'+typeIcon(o)+'</span>'+(o.name||o.type);
    d.onclick=()=>{c2.setActiveObject(o);c2.requestRenderAll();};l.appendChild(d);});}
['object:added','object:removed','object:modified','selection:created','selection:updated','selection:cleared'].forEach(e=>c2.on(e,refresh));

/* Sync the property panel when an object is selected */
function syncPanel(){
  const o=c2.getActiveObject();if(!o||o.type==='image')return;
  try{$('#col').value=hexCol(o.fill);}catch(e){}
  try{if(o.stroke)$('#scol').value=hexCol(o.stroke);}catch(e){}
  if(o.strokeWidth!=null)$('#sw').value=Math.round(o.strokeWidth);
  if(o.type==='i-text'&&o.fontSize)$('#fs').value=Math.round(o.fontSize);}
c2.on('selection:created',syncPanel);
c2.on('selection:updated',syncPanel);

/* Add objects */
$('#addText').onclick=()=>{const t=new fabric.IText('Edit text',{left:80,top:80,fontFamily:'Arial',fontSize:+$('#fs').value||72,fill:$('#col').value,name:'Text '+(++seq)});c2.add(t).setActiveObject(t);};
$('#addRect').onclick=()=>{const r=new fabric.Rect({left:80,top:80,width:400,height:200,fill:$('#col').value,name:'Shape '+(++seq)});c2.add(r).setActiveObject(r);};

/* Property handlers: fill, stroke, stroke-width, font-size */
$('#col').oninput=e=>{const o=c2.getActiveObject();if(o&&o.type!=='image'){o.set('fill',e.target.value);c2.requestRenderAll();}};
$('#scol').oninput=e=>{const o=c2.getActiveObject();if(o&&o.type!=='image'){o.set('stroke',e.target.value);if(!o.strokeWidth)o.set('strokeWidth',1);c2.requestRenderAll();}};
$('#sw').oninput=e=>{const o=c2.getActiveObject();if(o&&o.type!=='image'){o.set({strokeWidth:+e.target.value||0,strokeUniform:true});c2.requestRenderAll();}};
$('#fs').oninput=e=>{const o=c2.getActiveObject();if(o&&o.type==='i-text'){o.set('fontSize',+e.target.value||72);c2.requestRenderAll();}};

/* Delete, reorder */
const del=()=>{c2.getActiveObjects().forEach(o=>c2.remove(o));c2.discardActiveObject();c2.requestRenderAll();};
$('#del').onclick=del;
addEventListener('keydown',e=>{const o=c2.getActiveObject();
  if(e.key==='Delete'&&$('#t2').classList.contains('on')&&!(o&&o.isEditing)&&document.activeElement.tagName!=='INPUT')del();});
$('#up').onclick=()=>{const o=c2.getActiveObject();o&&(c2.bringForward(o),refresh());};
$('#down').onclick=()=>{const o=c2.getActiveObject();o&&(c2.sendBackwards(o),refresh());};

/* ------------------------------------------------------------------ */
/*  Export — PSD, ZIP                                                 */
/* ------------------------------------------------------------------ */
function layerOf(o){const bb=o.getBoundingRect(true,true);
  const L={name:o.name||o.type,canvas:o.toCanvasElement({enableRetinaScaling:false}),left:Math.round(bb.left),top:Math.round(bb.top)};
  if(o.type==='i-text'){const [r,g,b]=new fabric.Color(o.fill).getSource();
    L.text={text:o.text,transform:[1,0,0,1,L.left,L.top+o.fontSize*o.scaleY],style:{font:{name:'ArialMT'},fontSize:o.fontSize*o.scaleY,fillColor:{r,g,b}}};}
  return L;}
function layersOf(c){c.discardActiveObject();c.requestRenderAll();return c.getObjects().map(layerOf);}
function flatten(c,kids){const k=document.createElement('canvas');k.width=c._l.w;k.height=c._l.h;
  const x=k.getContext('2d');kids.forEach(l=>x.drawImage(l.canvas,l.left,l.top));return k;}
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}
function exportPSD(c,name){const kids=layersOf(c);if(!kids.length)return msg('Nothing to export.');
  const psd={width:c._l.w,height:c._l.h,canvas:flatten(c,kids),children:kids};let buf;
  try{buf=agPsd.writePsd(psd);}catch(e){kids.forEach(k=>delete k.text);buf=agPsd.writePsd(psd);msg('Text layers saved as pixels.');}
  dl(new Blob([buf],{type:'image/vnd.adobe.photoshop'}),name+'.psd');}
async function exportZip(c,name){const kids=layersOf(c);if(!kids.length)return msg('Nothing to export.');
  const z=new JSZip();kids.forEach((l,i)=>z.file(String(i+1).padStart(2,'0')+'_'+l.name.replace(/[^\w-]+/g,'_')+'.png',l.canvas.toDataURL('image/png').split(',')[1],{base64:true}));
  dl(await z.generateAsync({type:'blob'}),name+'_layers.zip');}
$('#psd2').onclick=()=>exportPSD(c2,'miko_canvas');
$('#zip2').onclick=()=>exportZip(c2,'miko_canvas');

/* ------------------------------------------------------------------ */
/*  Tab 3 — Lower Third Studio                                       */
/* ------------------------------------------------------------------ */
function build3(){c3.clear();const x=120,y=1080-300,h=150,a=$('#acc').value;
  const n=new fabric.IText($('#nm').value,{left:x+50,top:y+16,fontFamily:'Arial',fontWeight:'bold',fontSize:64,fill:'#ffffff',name:'Name'});
  const t=new fabric.IText($('#ti').value,{left:x+50,top:y+92,fontFamily:'Arial',fontSize:36,fill:'#cfd2d8',name:'Title'});
  const w=Math.max(n.width,t.width)+110;
  c3.add(new fabric.Rect({left:x,top:y,width:w,height:h,fill:'rgba(18,19,22,0.92)',name:'Plate'}),
         new fabric.Rect({left:x,top:y,width:14,height:h,fill:a,name:'Accent'}),n,t);c3.requestRenderAll();}
$('#build').onclick=build3;
$('#png3').onclick=()=>{const k=layersOf(c3);if(!k.length)return msg('Build a nameplate first.');flatten(c3,k).toBlob(b=>dl(b,'lower_third.png'));};
$('#psd3').onclick=()=>exportPSD(c3,'lower_third');
build3();

/* ------------------------------------------------------------------ */
/*  Boot                                                              */
/* ------------------------------------------------------------------ */
lucide.createIcons();
fetch('/health').then(r=>r.json()).then(j=>{if(j.app==='Miko Studio Slicer'){$('#dot').classList.add('ok');$('#srv').textContent='Server online';}}).catch(()=>{});
</script>
</body></html>
